// crank.proto — the contract for the PREDICT step of a spec-crystallization
// crank. Domain-neutral and lifted: it lives in `spec` (the spine) so the fleet
// (agora) and any corpus (ratio, …) bind to one contract instead of three copies.
//
// One reverse-diffusion crank is: predict → project → gate → measure.
//   • predict  — an agent fleet PROPOSES graph edits (this contract). Workers
//                implement CrankPredictor as agora Bidder-style endpoints
//                (in-process or RunPod serverless); predict is contract-bound,
//                not ad hoc.
//   • project  — the DETERMINISTIC corrector (spec: Spec.Compaction, Lean-proven
//                E(P G) ≤ E(G), idempotent) maps the proposal onto the
//                gate-passing manifold.
//   • gate     — spec_corpus_gates (SHACL + consistency) reject anything unsound.
//   • measure  — the energy SPARQL records E(G); the crank repeats with τ↓.
//
// Aligned with agora.v1 (Term/Triple/Provenance) so an agora bidder adapts with
// a thin shim; kept self-contained (no imports) so it validates standalone.
syntax = "proto3";

package fastverk.crank.v1;

option java_multiple_files = true;
option java_package = "dev.fastverk.crank.v1";
option java_outer_classname = "CrankProto";
option go_package = "github.com/fastverk/spec/crank/proto;crankv1";

// A graph term — exactly one of the three is set. Mirrors agora.v1.Term.
message Term {
  oneof term {
    string variable = 1;  // a query variable, no leading '?'
    string iri = 2;       // a prefixed IRI (e.g. rfc:dependsOn)
    string literal = 3;   // an RDF literal's lexical form
  }
}

// A subject–predicate–object triple. Mirrors agora.v1.Triple.
message Triple {
  Term subject = 1;
  Term predicate = 2;
  Term object = 3;
}

// Provenance + uncertainty for a proposal. Mirrors agora.v1.Provenance so the
// deterministic side can filter/weight by confidence and grounding.
message Provenance {
  repeated string proposer_models = 1;  // ensemble members that proposed it
  float confidence = 2;                 // mean per-triple agreement, [0,1]
  string proposer_id = 3;               // the fleet worker / bidder identity
  int32 repair_iters = 4;               // propose→validate→repair rounds it took
}

// The spec energy E(G) = w1·R + w2·C + w3·D + w4·U − w5·L − w6·S (RFC-001b §3),
// plus the annealing temperature. Drives exploration (high τ) vs settling (τ→0).
message EnergySnapshot {
  int32 redundancy = 1;      // R — duplicated claims/edges
  int32 contradictions = 2;  // C — claims that cannot co-hold
  int32 dangling = 3;        // D — loose references / missing definers
  int32 under_spec = 4;      // U — frontier: thin, ungrounded leaves
  int32 connectivity = 5;    // L — meaningful typed edges
  int32 symmetry = 6;        // S — recoverable motif symmetry (MDL)
  double temperature = 7;    // τ — position on the annealing schedule
}

// What the predictor is asked to do this crank.
message PredictRequest {
  repeated Triple context = 1;          // current graph (or a frontier subgraph)
  EnergySnapshot energy = 2;            // current E(G) + temperature
  repeated string frontier = 3;         // IRIs of under-specified leaves to attack
  repeated string allowed_prefixes = 4; // vocabulary the proposal must stay within
  string corpus_id = 5;                 // which corpus is being cranked (e.g. "ratio")
}

// A proposed graph edit — the reverse-diffusion denoising proposal.
message GraphDelta {
  repeated Triple add = 1;     // claims/edges to add
  repeated Triple remove = 2;  // claims/edges to retract
  Provenance prov = 3;
}

// The predictor's response. The deterministic corrector + gates are
// authoritative; projected_energy is advisory.
message PredictResponse {
  GraphDelta delta = 1;               // unset ⇒ the worker abstains this crank
  EnergySnapshot projected_energy = 2;
}

// The predict step of the crank. Implemented by fleet workers (agora Bidder
// endpoints; in-process or RunPod serverless). The orchestrator dials the fleet,
// collects deltas, then runs the deterministic project → gate → measure — which
// can only lower E(G) (see Spec.Compaction proofs).
service CrankPredictor {
  rpc Predict(PredictRequest) returns (PredictResponse);
}
