apiVersion: v1
kind: Service
metadata:
  name: {{ include "spec.fullname" . }}
  labels:
    {{- include "spec.labels" . | nindent 4 }}
    # How botnoc-web's discovery.rs finds + registers this plugin.
    fastverk.dev/plugin: spec
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "spec.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    # The gRPC meridian LayoutService — the shell's discovery reads this named
    # `grpc` port and dials GetNavTree for spec's nested nav subtree.
    - name: grpc
      port: {{ .Values.grpcPort }}
      targetPort: grpc
      protocol: TCP
