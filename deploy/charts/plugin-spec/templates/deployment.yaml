apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spec.fullname" . }}
  labels:
    {{- include "spec.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "spec.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "spec.selectorLabels" . | nindent 8 }}
    spec:
      volumes:
        # Shared source tree: the git-sync sidecar writes it, the plugin reads it.
        - name: estate
          emptyDir: {}
      containers:
        {{- if .Values.gate.enabled }}
        # The gate plane — the SPARQL suite over the corpus, held warm.
        #
        # ⛔ NO VOLUME, and no corpus paths. The corpus ships INSIDE this image
        # (//java:gate_image bakes corpus/studio + rdf/ontology). A gate report is
        # only meaningful against a stated corpus, and mounting one here would let
        # the image and the graph it gates version independently — two pods could
        # then both be right and disagree, with nothing in either answer saying
        # which corpus it read.
        #
        # ⛔ It binds 127.0.0.1. Containers in a pod share a network namespace, so
        # spec-server reaches it on localhost and NOTHING ELSE CAN. The front door
        # is the Rust process, which already holds the fleet's auth.
        #
        # ⚠ A plain `docker run -p` against this image publishes a port nothing
        # answers on, for the same reason. That is the topology, not a bug.
        - name: gate
          # `required`, because values.yaml says an empty tag "fails loudly at
          # render" and until this line that was simply untrue: it rendered
          # `spec-gate:` and failed in the cluster as ErrImagePull, one deploy and
          # several minutes away from the mistake.
          image: "{{ .Values.gate.image.repository }}:{{ required "gate.image.tag is required when gate.enabled — the deploying pipeline sets it to the pushed sha; an empty tag renders an invalid reference" .Values.gate.image.tag }}"
          imagePullPolicy: {{ .Values.gate.image.pullPolicy }}
          args: ["--port={{ .Values.gate.port }}"]
          # ⚠ NO probe on this container. It listens on loopback only, so the
          # kubelet — which probes from outside the container's network namespace
          # — cannot reach it, and a probe here would fail forever while the
          # process is healthy. spec-server's own readiness covers the pod.
          resources:
            {{- toYaml .Values.gate.resources | nindent 12 }}
        {{- end }}
        - name: spec-server
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required — the deploying pipeline sets it to the spec commit sha; an empty tag renders an invalid reference" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            - name: grpc
              containerPort: {{ .Values.grpcPort }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: PORT_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.port | quote }}
            - name: SPEC_GRPC_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.grpcPort | quote }}
            # The git-synced tree the index scans (immediate subdirs = repos).
            - name: SPEC_SOURCE_ROOT
              value: {{ .Values.sourceSync.mountPath | quote }}
            {{- with .Values.specRepos }}
            - name: SPEC_REPOS
              value: {{ . | quote }}
            {{- end }}
            - name: SPEC_INDEX_TTL_SECS
              value: {{ .Values.indexTtlSeconds | quote }}
            {{- if .Values.gate.enabled }}
            # The gate plane, reachable only because the two containers share this
            # pod's network namespace. Set ONLY when the sidecar is enabled: the
            # Derivation service reads its absence as "not deployed" and answers
            # FAILED_PRECONDITION naming this variable, which is a different and
            # more useful thing than a connection refused.
            - name: SPEC_GATE_ADDR
              value: {{ printf "http://127.0.0.1:%v" .Values.gate.port | quote }}
            {{- with .Values.gate.project }}
            # Which corpus that image bakes. Optional, and unset means the service
            # REFUSES a request that names a project rather than answering for
            # whichever corpus happens to be loaded — see values.yaml.
            - name: SPEC_GATE_PROJECT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.pluginToken.existingSecret }}
            - name: FASTVERK_PLUGIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.pluginToken.secretKey | quote }}
            {{- end }}
          volumeMounts:
            - name: estate
              mountPath: {{ .Values.sourceSync.mountPath }}
              readOnly: true
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.sourceSync.enabled }}
        # Multi-repo git-sync sidecar: shallow-clones/refreshes each sourceSync.repos
        # entry into <mountPath>/<name>, so the plugin's scan sees them as repos.
        #
        # PER-REPO CREDENTIALS. A repo entry may name its own `tokenSecret` /
        # `tokenKey`, which is what lets the estate span forges: the default
        # token is GitHub's `build-runner-github`, and a repo on
        # gitlab.savvifi.com carries its own instead. Previously one token
        # covered everything, which meant everything had to live on one forge —
        # and Studio, whose requirements this plugin now indexes, does not.
        #
        # The credentials are mounted as separate env vars (GIT_TOKEN_<NAME>)
        # rather than concatenated into the URLs at template time, so a token
        # never appears in the rendered manifest, in `kubectl get deploy -o yaml`,
        # or in an ArgoCD diff.
        - name: git-sync
          image: {{ .Values.sourceSync.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              {{- if .Values.sourceSync.token.existingSecret }}
              DEFAULT_AUTH="oauth2:${GIT_TOKEN}@"
              {{- else }}
              DEFAULT_AUTH=""
              {{- end }}
              root="{{ .Values.sourceSync.mountPath }}"
              while true; do
              {{- range .Values.sourceSync.repos }}
                u="{{ .url }}"; d="$root/{{ .name }}"
                {{- if .tokenSecret }}
                # This repo carries its own credential (a different forge).
                AUTH="oauth2:${GIT_TOKEN_{{ .name | upper | replace "-" "_" }}}@"
                {{- else }}
                AUTH="$DEFAULT_AUTH"
                {{- end }}
                case "$u" in https://*) u="https://${AUTH}${u#https://}" ;; esac
                if [ -d "$d/.git" ]; then
                  git -C "$d" fetch --depth {{ $.Values.sourceSync.depth }} origin HEAD 2>/dev/null \
                    && git -C "$d" reset --hard FETCH_HEAD >/dev/null 2>&1 || true
                else
                  git clone --depth {{ $.Values.sourceSync.depth }} "$u" "$d" || true
                fi
              {{- end }}
                sleep {{ .Values.sourceSync.periodSeconds }}
              done
          env:
            {{- if .Values.sourceSync.token.existingSecret }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sourceSync.token.existingSecret | quote }}
                  key: {{ .Values.sourceSync.token.secretKey | quote }}
            {{- end }}
            {{- range .Values.sourceSync.repos }}
            {{- if .tokenSecret }}
            - name: GIT_TOKEN_{{ .name | upper | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .tokenSecret | quote }}
                  key: {{ .tokenKey | default "token" | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: estate
              mountPath: {{ .Values.sourceSync.mountPath }}
        {{- end }}
