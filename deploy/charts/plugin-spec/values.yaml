replicaCount: 1

# ⚠ THIS FILE WAS STALE AGAINST WHAT IS DEPLOYED. It named the aion-dev ECR
# (042825952740) and tag 0.6.2, while the live pod in the `fastverk` cluster runs
# 491117466965.dkr.ecr.us-east-1.amazonaws.com/spec:<commit-sha>. Syncing the
# chart as written would have moved the image BACKWARDS, across accounts, to a
# tag that does not exist in the repository it would have pulled from.
#
# ⛔ NOTHING IN THIS REPO BUILDS OR PUSHES THAT IMAGE. `.github/workflows/ci.yml`
# has two jobs, `gate` and `console`, and neither touches ECR — the tags are spec
# commit SHAs pushed by the platform build-runner, per the Dockerfile's own note
# that "the platform's canonical build is the bazel rules_fastverk_plugin macro /
# //services/spec:spec-image". So the tag here is not something a spec PR can
# advance, and pinning one would drift the moment the runner pushes again.
image:
  repository: 491117466965.dkr.ecr.us-east-1.amazonaws.com/spec
  # Set by the deploying pipeline. Left empty rather than pinned to a stale value
  # — an empty tag fails loudly at render, a wrong one deploys quietly.
  tag: ""
  pullPolicy: IfNotPresent

# The plugin's HTTP/JSON facade (/healthz, /describe, /panels.binpb, /mcp, + the
# spec.v1.SpecIndex REST plane: specs, contracts, status, spec, contract).
port: 8080

# gRPC meridian LayoutService port (the nav plane). The shell's discovery reads
# the Service's named `grpc` port and dials GetNavTree for spec's nested nav.
grpcPort: 50056

# Shared gateway token the console presents as `Authorization: Bearer <token>`;
# the plugin validates it (require_gateway_token -> E_GATEWAY_AUTH). Same value
# botnoc-web sends to every plugin.
pluginToken:
  existingSecret: builds-secrets
  secretKey: plugin-token

# ── Source tree (the one real deploy dependency) ───────────────────────────────
# The index is a filesystem scan of $SPEC_SOURCE_ROOT, whose immediate subdirs
# MUST be the estate's repos. The git-sync sidecar clones/pulls `sourceSync.repos`
# into an emptyDir shared with the plugin. Absent/empty -> the index serves 0
# specs (the honest pre-sync posture).
#
# The list is the estate's Lean-bearing repos (all github.com/fastverk|tomato-bazel,
# private + public), cloned with the reused build-runner-github token below. To add
# a repo on a DIFFERENT forge (e.g. self-hosted gitlab), the sidecar's single token
# covers one forge; a second forge needs a per-repo cred or a second sidecar
# (see templates/deployment.yaml).
sourceSync:
  enabled: true
  image: alpine/git:latest
  mountPath: /estate # -> SPEC_SOURCE_ROOT
  periodSeconds: 60
  depth: 1
  # Default git token for PRIVATE repos (https clones as
  # https://oauth2:<token>@host/...). A repo on a DIFFERENT forge overrides it
  # with its own `tokenSecret` — see the studio entry below.
  # Reuse the estate's EXISTING GitHub connection: `build-runner-github` is the
  # same token the build-runner clones the org's repos with (read access incl.
  # private botnoc) — so spec doesn't need its own credential. (forge itself uses
  # a GitHub App, which mints per-request tokens and isn't a static clone cred.)
  # Override existingSecret for a different environment / a dedicated token.
  token:
    existingSecret: "build-runner-github"
    secretKey: token
  # name -> clone URL. `name` becomes the repo dir under mountPath (== the `repo`
  # column in the index).
  #
  # A repo may carry `tokenSecret` (+ optional `tokenKey`, default "token") to
  # use its own credential instead of the default above. That is what lets the
  # index span forges. Everything below is GitHub today and none of them
  # overrides it.
  #
  # ⛔ DO NOT RE-ADD `studio` HERE WITHOUT A RUNTIME CONSUMER. It was listed from
  # #27 until 2026-08-12, pointing at gitlab.savvifi.com/platform/studio-nextjs
  # with `tokenSecret: studio-gitlab` — a secret that was never created. That is
  # not a soft failure: a missing secretKeyRef is CreateContainerConfigError, so
  # git-sync could not start, so the POD could not start, so no new version of
  # this plugin could roll at all. It went unnoticed because the deploy was
  # already frozen when it landed (see the RepoBuild in fastverk/deploy#448); the
  # first sync after unfreezing is what surfaced it.
  #
  # The comment here used to justify it as "the source of the requirements corpus
  # this plugin serves … without it the corpus can only be regenerated by hand",
  # which conflates two different paths:
  #
  #   * the CORPUS is committed (corpus/studio/*.ttl) and baked into the gate
  #     image — the pod reads it from neither this clone nor the network;
  #   * the IMPORTER (tools/import/authreq_to_ttl.py) fetches the source document
  #     over the GitLab API with its OWN $GITLAB_TOKEN, run by hand. It does not
  #     read this synced tree, and nothing automated invokes it.
  #
  # Nothing in services/spec reads a studio path: the only "studio-nextjs" in the
  # server is a #[cfg(test)] fixture, and the index walks these dirs generically
  # looking for Lean specs — of which a Next.js app has none. So the clone cost a
  # credential, blocked every deploy, and produced an empty row.
  repos:
    - {name: botnoc, url: "https://github.com/fastverk/botnoc.git"}
    - {name: spec, url: "https://github.com/fastverk/spec.git"}
    - {name: rules_lean, url: "https://github.com/tomato-bazel/rules_lean.git"}
    - {name: rules_postgres, url: "https://github.com/tomato-bazel/rules_postgres.git"}
    - {name: agora, url: "https://github.com/fastverk/agora.git"}
    - {name: agentic_ide_runtime, url: "https://github.com/fastverk/agentic_ide_runtime.git"}
    - {name: rules_texlive, url: "https://github.com/fastverk/rules_texlive.git"}

# Restrict the scan to these repo dir names (CSV); empty = all synced dirs.
specRepos: ""
# Index cache TTL (seconds); "live" is bounded by this + sourceSync.periodSeconds.
indexTtlSeconds: 30

logLevel: "spec=info,info"

# ClusterIP: the console reaches the facade over Service DNS
# (http://spec.<ns>.svc:<port>). The fastverk.dev/plugin=spec label (service.yaml)
# is how botnoc-web's discovery.rs finds + registers it.
service:
  type: ClusterIP
  port: 8080
  annotations: {}

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

# ── The gate plane sidecar ─────────────────────────────────────────────────────
#
# //java:gate_image — the SPARQL authoring suite plus the corpus it gates, in one
# self-contained image. Serves /healthz, /gates and /preflight on loopback for
# spec-server to proxy.
#
# ✅ IT IS WIRED NOW. This block used to say "nothing proxies to it yet — the
# Derivation gRPC service in services/spec is unwritten". That service exists:
# spec-server serves `spec.v1.Derivation` (RunGates, Preflight) on the same gRPC
# port as the nav plane and reaches this container over loopback.
#
# ⚠ STILL DISABLED BY DEFAULT, for a different reason than before. Enabling it is
# a deployment decision — it adds a JVM with an unmeasured resident set to a
# running pod — not a wiring gap. With it OFF, Derivation answers
# FAILED_PRECONDITION naming $SPEC_GATE_ADDR, which says "no gate plane here"
# rather than pretending the call is merely unimplemented.
gate:
  enabled: false
  image:
    repository: 491117466965.dkr.ecr.us-east-1.amazonaws.com/spec-gate
    # Set by the deploying pipeline, like image.tag above. Empty now really does
    # fail at render (`required` in deployment.yaml) — until that landed, this
    # comment described a guard that did not exist and an empty tag rendered
    # `spec-gate:`, failing in the cluster as ErrImagePull instead.
    tag: ""
    pullPolicy: IfNotPresent
  port: 8081
  # Which corpus the image above bakes, passed to spec-server as
  # $SPEC_GATE_PROJECT.
  #
  # ⛔ DELIBERATELY EMPTY, and empty is not "any". The sidecar parses whatever its
  # image baked and reports no version, so spec-server cannot tell which corpus it
  # is holding. With this unset, a RunGates naming a project is REFUSED rather
  # than answered over whichever corpus happens to be loaded — a verdict about the
  # wrong graph is indistinguishable from a verdict about the right one. Set it to
  # what the image bakes (`studio` today) once that is pinned deliberately rather
  # than by whichever build produced the tag.
  project: ""
  # ⚠ UNMEASURED. The corpus is 220 KB and four gates run in ~0.5s on a laptop,
  # but nobody has measured the JVM's resident set under a warm Jena Model. These
  # are a starting point to watch, NOT a sizing. Do not copy RFC-004 §4.3's
  # "1 vCPU / 2 GB" — that was sized for a Fargate task nobody is building.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
