// Consumer-owned evidence: locators, exact revisions, counts, and hashes only.
// This is an integrity contract, not an attestation of independent review.
syntax = "proto3";
package spec.v1;
import "spec/v1/invariant.proto";

enum EvidenceDimension {
  EVIDENCE_DIMENSION_UNSPECIFIED = 0;
  EVIDENCE_DIMENSION_APPROVAL = 1;
  EVIDENCE_DIMENSION_GROUNDING = 2;
  EVIDENCE_DIMENSION_IMPLEMENTATION = 3;
  EVIDENCE_DIMENSION_TEST = 4;
  EVIDENCE_DIMENSION_PROOF = 5;
  EVIDENCE_DIMENSION_PRODUCTION_ACCEPTANCE = 6;
}

enum EvidenceState {
  EVIDENCE_STATE_UNSPECIFIED = 0;
  EVIDENCE_STATE_CURRENT = 1;
  EVIDENCE_STATE_MISSING = 2;
  EVIDENCE_STATE_STALE = 3;
  EVIDENCE_STATE_FAILED = 4;
  EVIDENCE_STATE_UNGROUNDED = 5;
  EVIDENCE_STATE_VACUOUS = 6;
  EVIDENCE_STATE_SKIPPED = 7;
  EVIDENCE_STATE_EXAMINED = 8;
  // An evaluator-issued start receipt; never a completed evaluation or pass.
  EVIDENCE_STATE_PENDING = 9;
}

enum FreshnessPolicy {
  FRESHNESS_POLICY_UNSPECIFIED = 0;
  // Deliberate opt-in for a model unchanged by unrelated implementation commits.
  FRESHNESS_POLICY_CONTENT = 1;
  FRESHNESS_POLICY_EXACT_REVISION = 2;
}

message EvidenceInput {
  string repository = 1;
  string path = 2;
  string sha256 = 3;
  string revision = 4;
  FreshnessPolicy freshness = 5;
}

message EvidenceRequirement {
  // Reuse Invariant.id, an existing IRI, or a consumer's durable clause ID.
  string id = 1;
  string owner = 2;
  repeated string aliases = 3;
  repeated EvidenceInput sources = 4;
}

message EvidenceCheck {
  string id = 1;
  string requirement_id = 2;
  EvidenceDimension dimension = 3;
  Check check = 4;
  string working_repository = 5;
  repeated string argv = 6;
  repeated EvidenceInput inputs = 7;
  // A consumer-owned immutable toolchain identity, also bound through inputs.
  string toolchain_id = 8;
  uint32 timeout_seconds = 9;
}

message EvidenceManifest {
  uint32 schema_version = 1;
  repeated EvidenceRequirement requirements = 2;
  repeated EvidenceCheck checks = 3;
}

message EvidenceExecutionRevision {
  string repository = 1;
  string revision = 2;
  // Git tree object identity, retained separately from the commit identity.
  string tree = 3;
}

// A producer check writes this message as protobuf JSON to stdout.
// No test logs, customer rows, or free-form payloads belong in this message.
message EvidenceObservation {
  Outcome outcome = 1;
  Population population = 2;
  repeated string ungrounded_terms = 3;
  bool skipped = 4;
  repeated EvidenceExecutionRevision executed_revisions = 5;
}

message EvidenceReceipt {
  string id = 1;
  string check_id = 2;
  string definition_sha256 = 3;
  string evaluator_sha256 = 4;
  string evaluator_revision = 5;
  repeated EvidenceInput inputs = 6;
  EvidenceObservation observation = 7;
  string observation_sha256 = 8;
  string executed_at = 9;
  EvidenceState execution_state = 10;
  // Optional externally verifiable CI execution locator; not a signature.
  string run_uri = 11;
  string observation_artifact_sha256 = 12;
  // Present only for an explicit nonexecutable review dimension.
  EvidenceReviewDecision review = 13;
  // Relative to the explicitly selected private execution artifact store.
  EvidenceArtifactBinding execution_record = 14;
}

message EvidenceLedger {
  uint32 schema_version = 1;
  // Append-only history. The last receipt for a check is its current candidate.
  repeated EvidenceReceipt receipts = 2;
}

message EvidenceCheckAssessment {
  string check_id = 1;
  EvidenceState state = 2;
  Population population = 3;
  string receipt_id = 4;
  repeated string reasons = 5;
}

message EvidenceDimensionAssessment {
  EvidenceDimension dimension = 1;
  EvidenceState state = 2;
  repeated EvidenceCheckAssessment checks = 3;
}

message EvidenceRequirementAssessment {
  string requirement_id = 1;
  repeated EvidenceDimensionAssessment dimensions = 2;
  bool ready = 3;
}

message EvidenceReport {
  uint32 schema_version = 1;
  repeated EvidenceRequirementAssessment requirements = 2;
  // All six dimensions, over all requirements. Selection never changes this.
  bool ready = 3;
  // The explicit selected check set only; not full specification readiness.
  bool selected_checks_passed = 4;
  uint64 selected_check_count = 5;
}

// An explicit human decision, separate from executing a predicate. This is a
// declaration with byte-bound provenance, not identity authentication or a
// cryptographic attestation that a review actually happened.
enum EvidenceReviewOrigin {
  EVIDENCE_REVIEW_ORIGIN_UNSPECIFIED = 0;
  EVIDENCE_REVIEW_ORIGIN_EXPLICIT_HUMAN = 1;
}

enum EvidenceReviewVerdict {
  EVIDENCE_REVIEW_VERDICT_UNSPECIFIED = 0;
  EVIDENCE_REVIEW_VERDICT_ACCEPTED = 1;
  EVIDENCE_REVIEW_VERDICT_REJECTED = 2;
}

message EvidenceReviewDecision {
  uint32 schema_version = 1;
  // Consumer-chosen idempotency identity, not an existing receipt identity.
  string id = 2;
  string check_id = 3;
  string definition_sha256 = 4;
  EvidenceDimension dimension = 5;
  EvidenceReviewOrigin origin = 6;
  EvidenceReviewVerdict verdict = 7;
  string reviewer = 8;
  string reviewed_at = 9;
  string source_uri = 10;
  // Actual decision words; never test output, customer rows or logs.
  string statement = 11;
  repeated EvidenceInput inputs = 12;
  // Scope reviewed by the person, not an executed data measurement.
  Population population = 13;
}

// Immutable private execution artifacts. Raw output never belongs in observations.
message EvidenceArtifactBinding {
  string path = 1;
  string sha256 = 2;
  uint64 byte_size = 3;
}

enum EvidenceExecutionPhase {
  EVIDENCE_EXECUTION_PHASE_UNSPECIFIED = 0;
  EVIDENCE_EXECUTION_PHASE_STARTED = 1;
  EVIDENCE_EXECUTION_PHASE_COMPLETED = 2;
}

enum EvidenceProcessTermination {
  EVIDENCE_PROCESS_TERMINATION_UNSPECIFIED = 0;
  EVIDENCE_PROCESS_TERMINATION_EXITED = 1;
  EVIDENCE_PROCESS_TERMINATION_TIMED_OUT = 2;
  EVIDENCE_PROCESS_TERMINATION_SPAWN_ERROR = 3;
  EVIDENCE_PROCESS_TERMINATION_CANCELED = 4;
  // A source/executable preflight refused before spawning a process.
  EVIDENCE_PROCESS_TERMINATION_NOT_STARTED = 5;
}

// Integrity provenance, not a signature or a hermetic toolchain attestation.
message EvidenceExecutionRecord {
  uint32 schema_version = 1;
  string id = 2;
  string start_receipt_id = 3;
  string final_receipt_id = 4;
  string definition_sha256 = 5;
  string check_id = 6;
  string evaluator_sha256 = 7;
  string evaluator_revision = 8;
  repeated EvidenceInput inputs = 9;
  repeated string argv = 10;
  string working_repository = 11;
  EvidenceExecutionRevision working_revision = 12;
  string executable_path = 13;
  EvidenceArtifactBinding executable = 14;
  uint32 timeout_seconds = 15;
  string started_at = 16;
  string completed_at = 17;
  EvidenceExecutionPhase phase = 18;
  EvidenceProcessTermination termination = 19;
  // Absent if no process started; negative signal values remain actual values.
  optional sint32 exit_code = 20;
  EvidenceArtifactBinding stdout = 21;
  EvidenceArtifactBinding stderr = 22;
  EvidenceArtifactBinding diagnostic = 23;
  EvidenceState evidence_state = 24;
  EvidenceArtifactBinding start_record = 25;
  string observation_sha256 = 26;
  bool working_dirty = 27;
}
