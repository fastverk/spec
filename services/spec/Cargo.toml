[package]
name = "spec-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "spec plugin — an estate-wide live index of formal specifications (Lean today) for the fastverk console."

[[bin]]
name = "spec-server"
path = "src/main.rs"

# The macro derives the crate target from `name` (no crate_prefix), so the lib
# name must be a bare "spec".
[lib]
name = "spec"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
prost.workspace = true
prost-types.workspace = true
# The shared MCP tool-surface crate (POST /mcp) — spec's ops as MCP tools for the
# console chat host. Consumed from the private plugin-crate home (cargo fetch needs
# CARGO_NET_GIT_FETCH_WITH_CLI=true + gh/ssh auth).
fastverk-mcp = { git = "https://github.com/fastverk/fastverk-plugin-crates", tag = "fastverk-mcp-v0.0.1" }
# The shared meridian LayoutService nav server — spec's nested nav subtree
# (Specs / Contracts / Proof-Status) over gRPC, so the shell renders a proper
# section instead of a flat leaf. Pure-Rust (pre-generated protos) at v0.0.2.
fastverk-layout = { git = "https://github.com/fastverk/fastverk-plugin-crates", tag = "fastverk-layout-v0.1.0" }
# gRPC transport for the LayoutService server (the nav plane) and, since the gate
# plane landed, the `spec.v1.Derivation` server this crate implements itself.
tonic = "0.12"
# The loopback hop to the gate sidecar. hyper directly rather than reqwest: all
# three are already in this lock via axum/tonic, so this adds no new transitive
# tree — and the hop is one GET and one POST to 127.0.0.1, which is the amount of
# HTTP client a whole TLS-capable stack would be carried in for.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

[build-dependencies]
prost-build.workspace = true
# Service stubs for derivation.proto ONLY — see build.rs for why this does not
# replace prost-build above.
tonic-build = "0.12"
