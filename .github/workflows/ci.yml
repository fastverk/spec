name: ci

# Build + test gate. Until this file landed there was NO CI on this repo that
# fired on a change: `spec` has never had a `.github/` directory, and its only
# checks (`fastverk/build`, `fastverk/tbzl-ready`) come from the in-cluster build
# plane, which last posted on 2026-08-06. So #16, #17, #18, #20 and #21 all
# merged without any automated signal — for a repo whose entire job is gating
# other people's builds.
#
# This does not replace the build plane. It is a signal that exists today, on
# Linux, which is the point: everything here was previously verified only on a
# maintainer's macOS laptop, and this estate has a documented history of
# darwin-green / linux-red.
#
# What it gates:
#
#   proofs  — //lean:audit_proofs_test. LOAD-BEARING, not a nicety.
#             `lean_test` does NOT check proofs: a `sorry` is a warning and
#             `lean` exits 0. Measured here — a probe theorem left
#             //lean:grounding_test green. That mattered because
#             //grounding:grounding_verified ties the corpus's `:provenBy` to
#             exactly that target. See lean/BUILD.bazel.
#   build   — everything that does not need the private plugin crates. Catches
#             the class of failure that made `fastverk/build` red for weeks: an
#             unpinned maven resolution needing an ambient JDK, and a graphviz
#             PDF path that could not build for any consumer.
#   test    — 51 of 52 test targets, including the RDF gate suite and its
#             adversarial fixtures, which plant a defect and fail if it is NOT
#             detected.
#   plugin  — the 52nd, //services/spec:spec_test. Conditional on an App token,
#             because the org credential is currently broken (see that step).
#             Turns itself on when the credential is fixed.
#
# ⚠ JDK. The maven fetch is pinned (//:maven_install.json) precisely so it no
# longer needs an ambient JDK at fetch time — but the BUILD actions still need
# a Java runtime, which setup-java provides. If this step is ever removed,
# //java/... fails with "Unable to locate a Java Runtime" and the summary will
# not mention Java.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Without this a merge burst stacks one full run per push. Keyed on event_name
# as well as ref so a PR run and the push run for the same branch do not cancel
# each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # --nohome_rc drops ~/.bazelrc, which is where a maintainer's registry
  # overrides live. The registries are pinned in //.bazelrc; this proves it.
  # Startup options only — this sits before the subcommand. --repo_env is a
  # COMMAND option and lives in //.bazelrc instead; putting it here fails with
  # "Unknown startup option", which is how the first attempt broke the gate.
  BAZEL_FLAGS: --nohome_rc

jobs:
  gate:
    name: bazel build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # //services/spec consumes the shared plugin crates as cargo git-deps on
      # fastverk/fastverk-plugin-crates, which is PRIVATE. crate_universe resolves
      # them during module-extension evaluation — before any target is analysed —
      # so without credentials the whole build dies at
      #
      #   error: failed to get `fastverk-layout` as a dependency of `spec-server`
      #     failed to authenticate when downloading repository
      #
      # `secrets.GITHUB_TOKEN` is scoped to this repository and cannot read
      # another private repo in the org. The org already carries an App for this,
      # so mint a short-lived installation token scoped to exactly one repo.
      #
      # 13 repos depend on those crates, so this block is worth copying verbatim.
      # Mints a short-lived installation token scoped to one repository, so
      # //services/spec can resolve its cargo git-deps on the PRIVATE
      # fastverk/fastverk-plugin-crates. `secrets.GITHUB_TOKEN` is scoped to this
      # repository and cannot read another private repo in the org.
      #
      # 13 repos depend on those crates and every one of them has this same hole,
      # so this block is worth copying verbatim.
      #
      # ⚠ HISTORY, because it cost several round trips: this failed for a day
      # with `A JSON web token could not be decoded` (401) on BOTH @v1 and @v2 and
      # for both orgs — the App private key behind FASTVERK_APP_PRIVATE_KEY had
      # gone bad. Rotated 2026-08-10.
      #
      # ⚠ When checking whether this worked, read the step LOG or `outcome`,
      # never `conclusion`: continue-on-error rewrites `conclusion` to success, so
      # the jobs API shows this green while it is failing.
      #
      # continue-on-error is kept deliberately. If the credential breaks again the
      # gate stays green on everything else and only the Rust step skips — a
      # permanently red required check trains people to merge through it, which is
      # how #16 and #17 landed unverified.
      - name: mint a token for the private plugin crates
        id: crates_token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FASTVERK_APP_ID }}
          private-key: ${{ secrets.FASTVERK_APP_PRIVATE_KEY }}
          owner: fastverk
          repositories: fastverk-plugin-crates

      # The deps are https:// URLs, so rewriting the prefix is enough — no ssh
      # keys, no per-dep URL edits. cargo must be told to shell out to git for
      # fetches (`CARGO_NET_GIT_FETCH_WITH_CLI`, set on the bazel steps via
      # --repo_env) or it uses its own transport and ignores this config.
      - name: let cargo use it
        if: steps.crates_token.outcome == 'success'
        run: |
          git config --global \
            url."https://x-access-token:${{ steps.crates_token.outputs.token }}@github.com/".insteadOf \
            "https://github.com/"

      - uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # Run FIRST. If the proof gate is broken, a green build below means
      # nothing — which is the exact failure this repo just had.
      - name: proofs (sorry, native_decide, axiom ratchet)
        run: bazel $BAZEL_FLAGS test //lean:audit_proofs_test --test_output=all

      # --keep_going: the first real run aborted at //impact:needle while
      # //paper:crystallization was still compiling, so whether that doc had the
      # same defect stayed unknown for a whole round trip. One failure per run is
      # too slow a loop when the only way to test Linux is to push.
      # Everything that does not need the private crates. This is the gate.
      # ⚠ Warm the tectonic bundle cache SERIALLY first. tectonic downloads its
      # TeX bundle into XDG_CACHE_HOME (see //.bazelrc), and three tectonic
      # targets building in parallel race to populate one cache — producing
      # partial files and errors that name a font or a missing .tex rather than
      # the cache:
      #
      #   expl3-code.tex: Font \c__fp_exp_intarray=cmr10 ... not loadable
      #   failed to open input file "pgfmathfunctions.code.tex"
      #
      # Observed as a FLAKE: an identical config went green one run earlier.
      # One serial build populates the cache completely; everything after finds
      # it warm. Cheap, because the second build reuses the first's outputs.
      # The tectonic bundle lives at $XDG_CACHE_HOME/Tectonic — which .bazelrc
      # already points at /tmp/xdg-cache on Linux (writable inside the sandbox
      # via the /tmp mount pair), so every action in a run shares one cache.
      # What was missing is persistence ACROSS runs: each run re-downloaded the
      # whole bundle from data1.fullyjustified.net, and on 2026-08-20 that CDN
      # started answering a burst of runs with 429 Too Many Requests, failing
      # main and every PR alike. Restore the newest previous bundle, top it up,
      # and save under a fresh key EVEN IF THE JOB FAILS — a partial download
      # saved is exactly how consecutive rate-limited runs converge to a full
      # cache instead of starting from zero every time. (A constant key would
      # freeze the first — possibly partial — save forever; per-run keys with a
      # prefix restore give newest-wins.)
      - name: restore the tectonic bundle cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/xdg-cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tectonic-bundle-${{ runner.os }}-

      # Retried with backoff, because the CDN's 429 is transient and every
      # attempt keeps what the last one fetched into the cache above. And
      # continue-on-error: when the CDN is down for the whole window the BUILD
      # and TEST lists below still run and report. The job is still red (the
      # three documents fail in `build`) but the red then names
      # //paper:crystallization, not — by implication — whatever the PR
      # changed. Measured 2026-08-20: five of seven runs across three PRs that
      # touched no LaTeX died at this step, in ~90 s, before a single test ran.
      - name: warm the tectonic cache
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            bazel $BAZEL_FLAGS build --jobs=1 //deck/... //paper/... //impact/... && exit 0
            echo "::warning::tectonic warm attempt $attempt failed (the bundle CDN rate-limits hosted runners); backing off"
            sleep $((attempt * 60))
          done
          exit 1

      # ⛔ A cache step that saves an EMPTY directory reports "Cache saved" just
      # like a full one. Two consecutive runs on 2026-08-20 restored 404 bytes
      # after Tectonic had compiled every document — the bundle was landing
      # somewhere this path is not. Say where it is and how big, every run, so
      # the cache's reality is in the log rather than assumed.
      - name: where did the bundle land?
        if: always()
        run: |
          for d in /tmp/xdg-cache/Tectonic "$HOME/.cache/Tectonic"; do
            if [ -d "$d" ]; then
              echo "$d: $(du -sh "$d" | cut -f1), $(find "$d" -type f | wc -l) files"
            else
              echo "$d: absent"
            fi
          done

      - name: save the tectonic bundle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/xdg-cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ⚠ These are EXPLICIT package lists, not //... — a new package is invisible
      # to the gate until it is named here, in both steps. //conformance/... is
      # listed because it is the only place the safety rules are cross-checked on
      # an ordinary PR; see the note on the plugin step below.
      - name: build
        run: |
          bazel $BAZEL_FLAGS build --keep_going \
            //conformance/... //corpus/... //crank/... //deck/... //examples/... \
            //graph/... //grounding/... //impact/... //java/... //lean/... \
            //paper/... //proto/... //rdf/... //tools/...

      - name: test
        run: |
          bazel $BAZEL_FLAGS test --keep_going --test_output=errors \
            //conformance/... //corpus/... //crank/... //deck/... //examples/... \
            //graph/... //grounding/... //impact/... //java/... //lean/... \
            //paper/... //proto/... //rdf/... //tools/...

      # The remaining test target — //services/spec:spec_test, whose 5 modules
      # include the routes.rs assertions that every served route is declared in
      # /describe. Runs automatically the moment the App credential works again;
      # no edit needed here.
      - name: plugin (needs the private crates)
        if: steps.crates_token.outcome == 'success'
        run: |
          bazel $BAZEL_FLAGS test --keep_going --test_output=errors //services/...


  # The half the gate job cannot see: spec resolved FROM THE REGISTRY, the way
  # a consumer resolves it. The gate job builds the working tree, which is
  # exactly the position that shipped #58 (rules_shell as dev_dependency —
  # invisible in-repo, fatal to every consumer) and #59 (`isolate = True`
  # rejected by a consumer's Bazel before dev-scoping is considered) green.
  # This job holds the first external corpus's position permanently:
  # smoke/consumer is its own Bazel module (root .bazelignore keeps it out of
  # the working-tree build) pinning the latest PUBLISHED spec, and runs the
  # full gate suite over spec's own negative-control fixture across the repo
  # boundary.
  #
  #   * No setup-java: the smoke's .bazelrc pins hermetic remotejdk_21, same as
  #     the real consumer. If this job ever says "Unable to locate a Java
  #     Runtime", the smoke's .bazelrc lost its Java pins — do not fix it by
  #     adding setup-java here, which would hide exactly that regression from
  #     consumers who don't have one.
  #   * Known spurious failure: a network error naming registry.tbzl.dev is the
  #     Fastly CDN, not the release — rerun the job. (Bazel falls through to
  #     the next registry only on 404, so a mirror second in line would not
  #     absorb an outage.)
  #   * On a release: publish to tomato-bazel/bazel-registry, THEN bump the pin
  #     in smoke/consumer/MODULE.bazel. This job is what proves the tag +
  #     registry entry actually resolve — the check that had to be done by hand
  #     for v0.7.0.
  consumer:
    name: registry consumer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: resolve the published spec from registry.tbzl.dev and run its gates
        working-directory: smoke/consumer
        run: bazel $BAZEL_FLAGS test //...


  # ⛔ The console is where the safety rules run for real, and it is the ONLY half
  # of the conformance suite that executes on an ordinary PR — //services/spec:
  # spec_test needs the private-crate token and has been skipping. If this job
  # stops running, a Rust/TypeScript divergence is caught by nothing that
  # executes; //conformance:conformance_test still compares the constants, but
  # constants are not behaviour.
  #
  # ⚠ Typecheck AND test AND build. `tsc --noEmit` misses what the bundler
  # rejects, and `next build` does not typecheck everything the way tsc does, so
  # each passes over the others' failures.
  console:
    name: console typecheck + conformance + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: install
        working-directory: console
        run: pnpm install --frozen-lockfile

      - name: typecheck
        working-directory: console
        run: pnpm exec tsc --noEmit

      # The shared cases. These live in //conformance and are executed here and
      # by services/spec; neither language owns them.
      - name: conformance
        working-directory: console
        run: pnpm exec vitest run

      # The consumer's half of RFC-004a: the dependency-free script a project's
      # CI runs to post a count under a machine credential. It lives outside
      # console/ because a consumer copies the one file, which also means vitest
      # (rooted in console/) cannot see it — so it runs here, on the same Node.
      - name: consumer script
        run: node --test tools/evaluation/post_evaluation.test.mjs

      # ⚠ Builds the read model INTO the bundle, so this also proves the eight
      # payloads still parse and still agree on one corpus_version. A build that
      # spans two corpora fails here rather than serving a read point that is a
      # lie whichever one you pick.
      - name: build
        working-directory: console
        run: pnpm exec next build

  # ── Push the gate image ────────────────────────────────────────────────────
  #
  # ⛔ NEVER ON pull_request. The `if` below gates on push-to-main and manual
  # dispatch, mirroring migrate.yml — a PR can come from a fork, and a fork's
  # workflow requesting an OIDC token that assumes an ECR push role is a supply
  # chain hole with a green tick on it. The trust policy on fastverk-ecr-push
  # allows `repo:fastverk/spec:*`, which does NOT distinguish a fork's PR from a
  # merge, so the workflow has to.
  #
  # ⚠ `needs: gate` is load-bearing, not tidiness. Pushing an image built from a
  # commit whose gates never ran publishes an artifact nobody checked, and the
  # tag is a commit SHA so it will look authoritative forever.
  #
  # ⚠ A job whose every step is `if:`-skipped still concludes SUCCESS. Read
  # `.jobs[].conclusion` filtered by SHA when checking whether this ran; a green
  # tick here is consistent with nothing having been pushed.
  image:
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC. No access keys anywhere in this repo's secrets, and nothing to
      # rotate — the token is minted per run and expires with it.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: assume the push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::491117466965:role/fastverk-ecr-push
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      # rules_oci pushes from Bazel, so the registry credential has to reach the
      # docker config the rule reads — which ecr-login above has just written.
      - name: push
        run: |
          bazel ${BAZEL_FLAGS} run //java:gate_image_push -- \
            --tag "${GITHUB_SHA::12}" --tag latest
